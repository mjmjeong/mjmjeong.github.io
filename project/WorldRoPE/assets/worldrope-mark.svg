<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120" role="img" aria-labelledby="title desc">
  <title id="title">WorldRoPE patch-to-world mark</title>
  <desc id="desc">One image patch branches into three Gaussian supports in a shared 3D coordinate frame.</desc>
  <defs>
    <filter id="soft" x="-65%" y="-80%" width="230%" height="260%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>
  <g fill="none" stroke="#c9c5d2" stroke-width="1.4" stroke-linecap="round">
    <path d="M80 91H225M80 91V17M80 91 56 108"/>
    <path d="M51 65 104 65M51 65 149 43M51 65 190 67" stroke="#b4a9c2" stroke-dasharray="4 4"/>
  </g>
  <g opacity=".38" filter="url(#soft)">
    <ellipse cx="107" cy="65" rx="25" ry="16" fill="#5ea3c5"/>
    <ellipse cx="150" cy="43" rx="27" ry="17" fill="#9b81bb"/>
    <ellipse cx="191" cy="67" rx="27" ry="17" fill="#6cb9a2"/>
  </g>
  <g fill="none" stroke-width="2.2">
    <ellipse cx="107" cy="65" rx="23" ry="12" transform="rotate(-20 107 65)" stroke="#548fb0"/>
    <ellipse cx="150" cy="43" rx="25" ry="13" transform="rotate(-20 150 43)" stroke="#8c70ae"/>
    <ellipse cx="191" cy="67" rx="25" ry="13" transform="rotate(-20 191 67)" stroke="#58a88f"/>
  </g>
  <g fill="#fff">
    <circle cx="107" cy="65" r="3.5" stroke="#548fb0" stroke-width="2"/>
    <circle cx="150" cy="43" r="3.5" stroke="#8c70ae" stroke-width="2"/>
    <circle cx="191" cy="67" r="3.5" stroke="#58a88f" stroke-width="2"/>
  </g>
  <rect x="17" y="49" width="34" height="34" rx="3" fill="#f2eff6" stroke="#5b4c78" stroke-width="3"/>
  <path d="M34 50V82M18 66H50" stroke="#c9bed9" stroke-width="1.3"/>
  <rect x="25" y="57" width="18" height="18" rx="2" fill="#5b4c78"/>
</svg>
